<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Job Portal - Create Account</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .signup-card {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <!-- Logo / Brand Title -->
            <div class="text-center mb-4">
                <a class="text-decoration-none fw-bold text-primary fs-3 d-flex align-items-center justify-content-center" href="landing_page.html">
                    <i class="bi bi-geo-alt-fill me-2"></i>Local Job Portal
                </a>
            </div>

            <!-- Signup Card Form -->
            <div class="card signup-card border-0 bg-white p-4 p-sm-5">
                <div class="mb-4 text-center">
                    <h2 class="fw-bold text-dark">Create Account</h2>
                    <p class="text-muted small">Join your local community to find work or post openings.</p>
                </div>

                <form method='POST'>
                    {% csrf_token %}
                    <!-- Username Input -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium text-secondary">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control bg-light border-start-0 ps-0" id="username" name='username' placeholder="johndoe123" required>
                        </div>
                    </div>

                    <!-- Email Address Input -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium text-secondary">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control bg-light border-start-0 ps-0" id="email" name='email' placeholder="name@example.com" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control bg-light border-start-0 ps-0" id="password" name='password' placeholder="••••••••" required>
                        </div>
                        <div class="form-text text-muted small mt-1">Must be at least 8 characters long.</div>
                    </div>

                    <!-- Terms and Conditions checkbox -->

                    <!-- Submit Register Button -->
                    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm mb-3">
                        Register Account
                    </button>
                </form>

                <!-- Divider -->
                <div class="position-relative text-center my-4">
                    <hr class="text-muted">
                    <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">Or</span>
                </div>

                <!-- Redirection to Login -->
                <div class="text-center">
                    <p class="text-muted small mb-0">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-semibold text-primary">Sign In</a></p>
                </div>
            </div>

            <!-- Footer Attribution -->
            <div class="text-center mt-4">
                <p class="text-muted small">© 2026 Local Job Portal. All rights reserved.</p>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
