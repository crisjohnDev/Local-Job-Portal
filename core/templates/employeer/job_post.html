{% extends 'employer.html' %}

{% block content %}
<!-- Top Heading Section -->
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
    <div>
        <h1 class="h2 fw-bold text-dark">Create Job Post</h1>
        <p class="text-muted">Fill out the performance guidelines, compensation figures, and target location parameters below.</p>
    </div>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="{% url 'job-list' %}" class="btn btn-outline-secondary btn-sm fw-medium py-2 px-3">
            <i class="bi bi-arrow-left me-1"></i> Back to Listings
        </a>
    </div>
</div>

<!-- Main Form Card Container -->
<div class="card dashboard-card border-0 bg-white p-4 p-sm-5 mb-5">
    <form method="POST">
        {% csrf_token %}
        
        <!-- Section: Basic Information -->
        <h5 class="fw-bold text-dark mb-4 pb-2 border-bottom text-employer">
            <i class="bi bi-info-circle me-2"></i>Position Details
        </h5>
        
        <div class="row g-3 mb-4">
            <!-- Job Title -->
            <div class="col-md-8">
                <label for="job_title" class="form-label fw-medium text-secondary">Job Title</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-briefcase"></i></span>
                    <input type="text" name="title" id="job_title" class="form-control bg-light border-start-0 ps-0" placeholder="e.g., Senior Systems Administrator" required>
                </div>
            </div>

            <!-- Job Type / Arrangement -->
            <div class="col-md-4">
                <label for="job_type" class="form-label fw-medium text-secondary">Work Arrangement</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-clock"></i></span>
                    <select name="job_type" id="job_type" class="form-select bg-light border-start-0 ps-0" required>
                        <option value="" disabled selected>Select setup...</option>
                        <option value="full_time">Full-time</option>
                        <option value="part_time">Part-time</option>
                        <option value="contract">Contract</option>
                        <option value="internship">Internship</option>
                        <option value="remote">Remote Friendly</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Section: Compensation & Location -->
        <h5 class="fw-bold text-dark mb-4 pt-2 pb-2 border-bottom text-employer">
            <i class="bi bi-cash-stack me-2"></i>Compensation & Workspace
        </h5>

        <div class="row g-3 mb-4">
            <!-- Salary Target Range -->
            <div class="col-md-6">
                <label for="salary" class="form-label fw-medium text-secondary">Salary</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-currency-dollar"></i></span>
                    <input type="text" name="salary" id="salary" class="form-control bg-light border-start-0 ps-0" placeholder="e.g., $4,500 - $5,500 / month" required>
                </div>
            </div>

            <!-- Specific Local Location -->
            <div class="col-md-6">
                <label for="location" class="form-label fw-medium text-secondary">Location</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-geo-alt"></i></span>
                    <input type="text" name="location" id="location" class="form-control bg-light border-start-0 ps-0" placeholder="e.g., Corporate Hub, West District" required>
                </div>
            </div>
        </div>

        <!-- Section: Text Areas & Status Toggles -->
        <h5 class="fw-bold text-dark mb-4 pt-2 pb-2 border-bottom text-employer">
            <i class="bi bi-file-text me-2"></i>Operational Mandate
        </h5>

        <!-- Description Field -->
        <div class="mb-4">
            <label for="description" class="form-label fw-medium text-secondary">Description & Qualifications</label>
            <textarea name="description" id="description" class="form-control bg-light" rows="6" placeholder="Provide a summary detailing responsibilities, expectations, shift conditions, and preferred technical skill requirements..." required></textarea>
        </div>

        <!-- Form Operations Actions Footer -->
        <div class="d-flex align-items-center justify-content-end gap-2 border-top pt-4">
            <button type="reset" class="btn btn-light border px-4 py-2 fw-medium">Clear Fields</button>
            <button type="submit" class="btn btn-employer shadow-sm px-5 py-2 fw-semibold">
                <i class="bi bi-cloud-arrow-up me-1"></i> Save & Open Post
            </button>
        </div>

    </form>
</div>
{% endblock %}
