<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Job Portal - Employer Login</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        /* Custom Employer Theme (Teal/Cyan accents for recruitment identity) */
        .btn-employer {
            background-color: #0f766e;
            color: white;
            border: none;
        }
        .btn-employer:hover {
            background-color: #115e59;
            color: white;
        }
        .text-employer {
            color: #0f766e !important;
        }
        .login-card {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-top: 4px solid #0f766e;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <!-- Logo / Brand Title -->
            <div class="text-center mb-4">
                <a class="text-decoration-none fw-bold text-employer fs-3 d-flex align-items-center justify-content-center" href="landing_page.html">
                    <i class="bi bi-building-fill text-employer me-2"></i>Local Job Portal
                </a>
                <span class="badge bg-secondary-subtle text-secondary small px-2.5 py-1 mt-1">Employer Workspace</span>
            </div>

            <!-- Login Card -->
            <div class="card login-card border-0 bg-white p-4 p-sm-5">
                <div class="mb-4 text-center">
                    <h2 class="fw-bold text-dark">Welcome Back</h2>
                    <p class="text-muted small">Sign in to manage openings and review job candidates.</p>
                </div>

                <form method='POST'>
                    {% csrf_token %}
                    <!-- Username/Email Input -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium text-secondary">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" name='username' class="form-control bg-light border-start-0 ps-0" id="username" placeholder="employer_hub" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-1">
                            <label for="password" class="form-label fw-medium text-secondary mb-0">Password</label>
                           
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" name='password' class="form-control bg-light border-start-0 ps-0" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-employer w-100 py-2.5 fw-semibold shadow-sm mb-3">
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="position-relative text-center my-4">
                    <hr class="text-muted">
                    <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">New to Hiring?</span>
                </div>

                <!-- Registration link -->
                <div class="text-center">
                    <p class="text-muted small mb-0">Need a corporate account? <a href="{% url 'employer-signup' %}" class="text-decoration-none fw-semibold text-employer">Create an Employer Account</a></p>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center mt-4">
                <p class="text-muted small">© 2026 Local Job Portal. All rights reserved.</p>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
