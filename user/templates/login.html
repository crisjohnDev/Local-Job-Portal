<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Job Portal - Admin Login</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .login-container {
            min-height: 100vh;
        }
        .brand-section {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row login-container">
        <!-- Left Side: Local Brand Panel / Quick Stats -->
        <div class="col-lg-5 brand-section d-none d-lg-flex flex-column justify-content-center align-items-center p-5 text-center">
            <div class="mb-4">
                <i class="bi bi-geo-alt-fill" style="font-size: 4rem;"></i>
            </div>
            <h1 class="fw-bold mb-3">Local Job Portal</h1>
            <p class="lead mb-5 text-white-50">Connecting local talent with community employers. Manage regional listings, review applicants, and track local employment trends.</p>
        </div>

        <!-- Right Side: Login Form -->
        <div class="col-lg-7 d-flex align-items-center justify-content-center bg-white p-5">
            <div class="w-100" style="max-width: 420px;">
                <!-- Mobile Branding (Only visible on screens smaller than lg) -->
                <div class="d-lg-none text-center mb-4 text-primary">
                    <i class="bi bi-geo-alt-fill display-4"></i>
                    <h2 class="fw-bold mt-2 text-dark">Local Job Portal</h2>
                </div>

                <div class="mb-4">
                    <h2 class="fw-bold text-dark">Welcome back</h2>
                    <p class="text-muted">Enter your credentials to access the Job Portal.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <!-- Username Input -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" name='username' class="form-control bg-light border-start-0 ps-0" id="username" placeholder="admin_username" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-1">
                            <label for="password" class="form-label fw-semibold mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" name='password' class="form-control bg-light border-start-0 ps-0" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                        Sign In <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </form>

                <!-- Redirect/Signup Link -->
                <div class="text-center mt-3">
                    <p class="text-muted small">Don't have an account? <a href="{% url 'signup' %}" class="text-decoration-none fw-semibold text-primary">Create account</a></p>
                </div>


            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
